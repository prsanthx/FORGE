id: medium_update_priority
difficulty: medium
title: Update titles and priorities
prompt: |
  I am not a programmer. Please let me change a todo's title.
  Blank titles must be rejected when the title changes.
  Please add a priority of low, med, or high, defaulting to med.
  Please reject any other priority.
  Keep add, list, get, and remove working.
  Add tests for the new behavior.
oracle: test_medium_update_priority.py
