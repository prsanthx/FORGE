name: baseline
description: >
  Baseline LLM. The model edits the repo directly, with no plan, no knowledge-graph
  retrieval, no verification funnel, and no recovery. Failures cascade.
features:
  planning: false
  hierarchical_planning: false
  verification: false
  recovery: false
  kg_retrieval: false
  git_checkpoints: false
  failure_memory: false
  context_packs: false
  graph_rag: false
verification:
  levels: []
  fail_fast: true
recovery:
  max_retries: 0
  risk_threshold: 1.0
  strategies: []
executor:
  max_steps_per_task: 4
  context_char_budget: 2000
context:
  spill: true
  dedupe_reads: true
  mask_old: true
  agents_md: true
  prompt_cache: true
llm:
  provider: mock
  model: mock-small
  temperature: 0.2
  max_tokens: 4096
  base_url: null
  api_key_env: null
tools:
  enabled:
    - list_dir
    - write_file
