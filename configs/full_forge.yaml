name: full_forge
description: >
  Full FORGE. Hierarchical planning, knowledge-graph context packs, the
  verification funnel, adaptive recovery, failure memory, and git checkpoints.
features:
  planning: true
  hierarchical_planning: true
  verification: true
  recovery: true
  kg_retrieval: true
  git_checkpoints: true
  failure_memory: true
  context_packs: true
  graph_rag: true
verification:
  levels:
    - syntax
    - unit
    - integration
    - requirement
    - regression
    - security
  fail_fast: true
recovery:
  max_retries: 3
  risk_threshold: 0.72
  strategies:
    - retry
    - replan
    - rollback
    - isolate
    - ask_human
executor:
  max_steps_per_task: 12
  context_char_budget: 7000
context:
  spill: true
  dedupe_reads: true
  mask_old: true
  agents_md: true
  prompt_cache: true
  spill_chars: 3500
  spill_file_chars: 24000
  mask_chars: 12000
llm:
  provider: mock
  model: mock-small
  temperature: 0.2
  max_tokens: 4096
  base_url: null
  api_key_env: null
tools:
  enabled:
    - search
    - read_file
    - write_file
    - list_dir
    - terminal
    - git
    - kg_query
