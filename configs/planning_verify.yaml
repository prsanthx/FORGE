name: planning_verify
description: >
  Planning plus the multi-level verification funnel. Failures are diagnosed and
  recorded, but there is no adaptive recovery budget, so a miss is surfaced
  instead of silently shipped.
features:
  planning: true
  hierarchical_planning: true
  verification: true
  recovery: false
  kg_retrieval: false
  git_checkpoints: true
  failure_memory: true
  context_packs: false
  graph_rag: false
verification:
  levels:
    - syntax
    - unit
    - integration
    - requirement
    - regression
    - security
  fail_fast: true
recovery:
  max_retries: 0
  risk_threshold: 0.72
  strategies: []
executor:
  max_steps_per_task: 8
  context_char_budget: 5000
context:
  spill: true
  dedupe_reads: true
  mask_old: true
  agents_md: true
  prompt_cache: true
llm:
  provider: mock
  model: mock-small
  temperature: 0.2
  max_tokens: 4096
  base_url: null
  api_key_env: null
tools:
  enabled:
    - list_dir
    - read_file
    - search
    - write_file
    - terminal
    - git
